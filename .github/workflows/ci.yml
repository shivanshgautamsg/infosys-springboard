name: R Validation CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R Packages
        run: |
          install.packages(c("rpart", "class", "jsonlite", "testthat"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Run Reproduction Pipeline
        run: |
          Rscript reproduce_results.R

      - name: Run Automated Benchmark Validation (26/26 Checks)
        run: |
          Rscript validate_results.R

      - name: Run Testthat Unit Tests (39/39 Tests)
        run: |
          Rscript -e "testthat::test_file('tests/testthat/test_models.R')"
